name: Meme Screener

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple screener runs from modifying seen_tokens.json
# at the same time.
concurrency:
  group: meme-screener
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (single pass)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          RUN_ONCE: "true"
        run: python solana_meme_screener.py

      - name: Save seen-tokens list back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_tokens.json

          if git diff --staged --quiet; then
            echo "No changes to seen_tokens.json"
            exit 0
          fi

          git commit -m "Update seen tokens [skip ci]"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
