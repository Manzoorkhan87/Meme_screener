# GitHub Actions workflow: runs the meme screener on a schedule.
# Free — no credit card, no external host needed. Runs on GitHub's
# own servers using your repo's free Actions minutes.
#
# IMPORTANT: this file must live at exactly this path in your repo:
#   .github/workflows/screener.yml
# GitHub only detects workflow files inside .github/workflows/.

name: Meme Screener

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort, not exact —
    # during high load it can run a few minutes late. That's normal.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Lets you manually trigger a run from the GitHub Actions tab,
    # useful for testing without waiting for the schedule.

permissions:
  contents: write   # needed so the workflow can commit seen_tokens.json back

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener (single pass)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          RUN_ONCE: "true"
        run: python solana_meme_screener.py

      - name: Save seen-tokens list back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_tokens.json
          git diff --staged --quiet || git commit -m "Update seen tokens [skip ci]"
          git push
